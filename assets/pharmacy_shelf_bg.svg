<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Ambient Lighting Gradients -->
    <linearGradient id="bgGrad" x1="960" y1="0" x2="960" y2="1080" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0f172a"/>
      <stop offset="0.4" stop-color="#064e3b"/>
      <stop offset="0.8" stop-color="#022c22"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    
    <linearGradient id="shelfGrad" x1="0" y1="0" x2="1920" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1e293b" stop-opacity="0.4"/>
      <stop offset="0.5" stop-color="#334155" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#1e293b" stop-opacity="0.4"/>
    </linearGradient>

    <linearGradient id="boxGradEmerald" x1="0" y1="0" x2="0" y2="1" gradientUnits="userSpaceOnUse">
      <stop stop-color="#059669" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#065f46" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="boxGradTeal" x1="0" y1="0" x2="0" y2="1" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0d9488" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#115e59" stop-opacity="0.85"/>
    </linearGradient>

    <linearGradient id="boxGradWhite" x1="0" y1="0" x2="0" y2="1" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f8fafc" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#e2e8f0" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="boxGradAmber" x1="0" y1="0" x2="0" y2="1" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d97706" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#92400e" stop-opacity="0.8"/>
    </linearGradient>

    <radialGradient id="centerGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.16"/>
      <stop offset="40%" stop-color="#0d9488" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    
    <filter id="softBlur" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
  </defs>

  <!-- Deep Base Surface -->
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>
  
  <!-- Subtle Ambient Glow -->
  <rect width="1920" height="1080" fill="url(#centerGlow)"/>

  <!-- Blurred Architectural Pharmacy Shelving Structure -->
  <g filter="url(#softBlur)" opacity="0.32">
    
    <!-- Top Shelf 1 -->
    <rect x="120" y="160" width="1680" height="14" rx="3" fill="url(#shelfGrad)"/>
    <line x1="120" y1="160" x2="1800" y2="160" stroke="#059669" stroke-opacity="0.3" stroke-width="1.5"/>

    <!-- Medicine Boxes on Shelf 1 -->
    <rect x="160" y="70" width="48" height="90" rx="3" fill="url(#boxGradWhite)"/>
    <rect x="166" y="80" width="36" height="6" fill="#059669" fill-opacity="0.8"/>
    <rect x="214" y="85" width="52" height="75" rx="3" fill="url(#boxGradEmerald)"/>
    <rect x="272" y="65" width="44" height="95" rx="3" fill="url(#boxGradTeal)"/>
    <rect x="322" y="90" width="60" height="70" rx="3" fill="url(#boxGradWhite)"/>
    <rect x="390" y="75" width="50" height="85" rx="3" fill="url(#boxGradAmber)"/>

    <!-- Right Side Shelf 1 -->
    <rect x="1480" y="65" width="56" height="95" rx="3" fill="url(#boxGradWhite)"/>
    <rect x="1542" y="80" width="46" height="80" rx="3" fill="url(#boxGradEmerald)"/>
    <rect x="1594" y="70" width="62" height="90" rx="3" fill="url(#boxGradTeal)"/>
    <rect x="1662" y="92" width="40" height="68" rx="3" fill="url(#boxGradWhite)"/>

    <!-- Middle Shelf 2 -->
    <rect x="120" y="380" width="1680" height="14" rx="3" fill="url(#shelfGrad)"/>
    <line x1="120" y1="380" x2="1800" y2="380" stroke="#059669" stroke-opacity="0.3" stroke-width="1.5"/>

    <!-- Medicine Boxes on Shelf 2 -->
    <rect x="150" y="270" width="65" height="110" rx="4" fill="url(#boxGradEmerald)"/>
    <rect x="222" y="295" width="45" height="85" rx="3" fill="url(#boxGradWhite)"/>
    <rect x="274" y="260" width="55" height="120" rx="3" fill="url(#boxGradTeal)"/>
    <rect x="336" y="300" width="70" height="80" rx="3" fill="url(#boxGradWhite)"/>
    
    <rect x="1450" y="280" width="52" height="100" rx="3" fill="url(#boxGradWhite)"/>
    <rect x="1510" y="265" width="58" height="115" rx="3" fill="url(#boxGradEmerald)"/>
    <rect x="1574" y="290" width="48" height="90" rx="3" fill="url(#boxGradAmber)"/>
    <rect x="1630" y="275" width="64" height="105" rx="3" fill="url(#boxGradTeal)"/>

    <!-- Lower Shelf 3 -->
    <rect x="120" y="600" width="1680" height="14" rx="3" fill="url(#shelfGrad)"/>
    <line x1="120" y1="600" x2="1800" y2="600" stroke="#059669" stroke-opacity="0.3" stroke-width="1.5"/>

    <!-- Bottom Shelf 4 -->
    <rect x="120" y="820" width="1680" height="14" rx="3" fill="url(#shelfGrad)"/>

  </g>

  <!-- Clean Subtle Geometry Grid for High Tech Medical Precision -->
  <g opacity="0.18">
    <circle cx="960" cy="540" r="320" stroke="#059669" stroke-width="1" stroke-dasharray="4 8"/>
    <circle cx="960" cy="540" r="480" stroke="#0d9488" stroke-width="1" stroke-dasharray="6 12"/>
    <line x1="960" y1="60" x2="960" y2="1020" stroke="#059669" stroke-width="0.75" stroke-dasharray="8 8"/>
    <line x1="200" y1="540" x2="1720" y2="540" stroke="#059669" stroke-width="0.75" stroke-dasharray="8 8"/>
  </g>

  <!-- Soft Vignette & Center Darkening Mask to ensure 100% Text Legibility -->
  <radialGradient id="vignetteMask" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#0f172a" stop-opacity="0.55"/>
    <stop offset="60%" stop-color="#0f172a" stop-opacity="0.75"/>
    <stop offset="100%" stop-color="#0f172a" stop-opacity="0.94"/>
  </radialGradient>
  <rect width="1920" height="1080" fill="url(#vignetteMask)"/>
</svg>
